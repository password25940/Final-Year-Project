{% extends "base.html" %}{% block content %}<div class="auth-card"><p class="eyebrow">STUDENT PORTAL</p><h1>Welcome back</h1><p class="text-muted">Sign in with your approved PRN and password.</p><form method="post"><label>PRN / Roll number</label><input class="form-control mb-3" name="student_id" inputmode="numeric" pattern="[0-9]{14}" maxlength="14" placeholder="23021351242001" required><label>Password</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-primary w-100">Sign in</button></form><div class="mt-4 p-3 rounded-3 bg-light small"><strong>First login?</strong><br>Use the default password <code>123456</code>. You will be asked to create a personal password.</div></div>{% endblock %}
